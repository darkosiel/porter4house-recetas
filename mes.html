<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porter4House — Recetas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="mes-header">
      <h1 id="mesTitle">Cargando...</h1>
      <button class="btn btn-primary" id="btnZip">&#x2B07; Descargar todo el mes (ZIP)</button>
    </div>
    <div id="recipeGrid" class="recipe-grid">
      <p class="loading-grid">Cargando recetas...</p>
    </div>
  </div>

  <!-- Modal visor PDF -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h4 id="modalTitle"></h4>
        <a id="modalNewTab" href="#" target="_blank" rel="noopener" class="btn-newtab">&#x2197; Nueva pestana</a>
        <button class="btn-close" id="btnCloseModal" aria-label="Cerrar">&#x2715;</button>
      </div>
      <iframe id="pdfFrame" src="" title="Receta PDF" allowfullscreen></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mes.js"></script>
</body>
</html>
